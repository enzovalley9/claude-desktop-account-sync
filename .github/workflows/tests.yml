name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scenarios:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Scenarios on made-up data
        run: python -I tests/test_scenarios.py --tmp "$RUNNER_TEMP"
      - name: Script help
        run: python -I skills/account-sync/scripts/account_sync.py --help
